name: Deepbrid review items 3-5

on:
  push:
    branches:
      - agent/deepbrid-review-3-5
    paths:
      - .github/workflows/deepbrid-review-3-5.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deepbrid-review-3-5

      - name: Apply exact Deepbrid fixes
        shell: python
        run: |
          from pathlib import Path

          deepbrid_path = Path('omega/plugin.video.umbrella/resources/lib/debrid/deepbrid.py')
          sources_path = Path('omega/plugin.video.umbrella/resources/lib/modules/sources.py')

          deepbrid = deepbrid_path.read_text(encoding='utf-8')
          sources = sources_path.read_text(encoding='utf-8')

          old_single = '''        if len(links) == 1:\n            log_utils.log(\n                'Deepbrid returning single-file torrent: '\n                'id=%s filename=%s link=%s' % (\n                    info.get('id'),\n                    info.get('filename'),\n                    links[0]\n                ),\n                level=log_utils.LOGDEBUG\n            )\n            return links[0]\n'''

          new_single = '''        if len(links) == 1:\n            probe = self._probe_torrent_link(\n                links[0],\n                0\n            )\n\n            if not probe or not self._is_video_probe(probe):\n                log_utils.log(\n                    'Deepbrid single-file torrent is not a video: %s' %\n                    repr(probe),\n                    level=log_utils.LOGWARNING\n                )\n                return None\n\n            fresh_info = self.torrent_info(\n                info.get('id')\n            )\n\n            if not isinstance(fresh_info, dict):\n                return None\n\n            fresh_links = fresh_info.get('links') or []\n\n            if len(fresh_links) == 1:\n                log_utils.log(\n                    'Deepbrid returning refreshed single video file: '\n                    'id=%s filename=%s' % (\n                        info.get('id'),\n                        probe.get('filename')\n                    ),\n                    level=log_utils.LOGDEBUG\n                )\n                return fresh_links[0]\n\n            log_utils.log(\n                'Deepbrid could not safely refresh single-file torrent',\n                level=log_utils.LOGWARNING\n            )\n            return None\n'''

          if deepbrid.count(old_single) != 1:
              raise SystemExit('single-file block did not match exactly once')
          deepbrid = deepbrid.replace(old_single, new_single, 1)

          old_auth = "            control.setSetting('deepbrid.token', key)\n"
          new_auth = "            control.setSetting('deepbrid.token', key)\n            control.setSetting('deepbrid.enable', 'true')\n"
          if deepbrid.count(old_auth) != 1:
              raise SystemExit('auth token write did not match exactly once')
          deepbrid = deepbrid.replace(old_auth, new_auth, 1)

          old_remove = "        control.setSetting(\n            'deepbrid.token',\n            ''\n        )\n"
          new_remove = "        control.setSetting(\n            'deepbrid.token',\n            ''\n        )\n        control.setSetting(\n            'deepbrid.enable',\n            'false'\n        )\n"
          if deepbrid.count(old_remove) != 1:
              raise SystemExit('remove-auth token write did not match exactly once')
          deepbrid = deepbrid.replace(old_remove, new_remove, 1)

          old_cloud = "\t\tif getSetting('db_cloud.enabled') == 'true':\n\t\t\tdirectstart.extend([i for i in direct if i['provider'] == 'db_cloud'])\n"
          if sources.count(old_cloud) != 1:
              raise SystemExit('stale db_cloud block did not match exactly once')
          sources = sources.replace(old_cloud, '', 1)

          deepbrid_path.write_text(deepbrid, encoding='utf-8')
          sources_path.write_text(sources, encoding='utf-8')

      - name: Remove one-off workflow
        run: rm .github/workflows/deepbrid-review-3-5.yml

      - name: Commit patch
        run: |
          git config user.name "Suyash Saluja"
          git config user.email "suyash691@live.in"
          git add omega/plugin.video.umbrella/resources/lib/debrid/deepbrid.py \
                  omega/plugin.video.umbrella/resources/lib/modules/sources.py \
                  .github/workflows/deepbrid-review-3-5.yml
          git commit -m "Finish Deepbrid review fixes"
          git push origin HEAD:agent/deepbrid-review-3-5
