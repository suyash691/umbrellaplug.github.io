name: Remove dead Deepbrid resolve_usenet

on:
  push:
    branches:
      - agent/remove-dead-resolve-usenet

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-dead-resolve-usenet
      - name: Remove dead method
        run: python .github/scripts/remove_dead_resolve_usenet.py
      - name: Validate Deepbrid module
        run: |
          python -m py_compile omega/plugin.video.umbrella/resources/lib/debrid/deepbrid.py
          ! grep -q 'def resolve_usenet' omega/plugin.video.umbrella/resources/lib/debrid/deepbrid.py
          git diff --check
      - name: Remove one-off audit files
        run: |
          rm .github/scripts/remove_dead_resolve_usenet.py
          rm .github/workflows/remove-dead-resolve-usenet.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add omega/plugin.video.umbrella/resources/lib/debrid/deepbrid.py .github/scripts/remove_dead_resolve_usenet.py .github/workflows/remove-dead-resolve-usenet.yml
          git commit -m "Remove dead Deepbrid resolve_usenet"
          git push origin HEAD:agent/remove-dead-resolve-usenet
