name: Deepbrid db_cloud integration

on:
  push:
    branches:
      - agent/deepbrid-db-cloud
    paths:
      - .github/workflows/deepbrid-db-cloud.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deepbrid-db-cloud

      - name: Apply integration patch
        run: python .github/deepbrid_db_cloud_patch.py

      - name: Syntax and XML checks
        shell: python
        run: |
          from pathlib import Path
          from xml.etree import ElementTree

          paths = [
              Path('omega/plugin.video.umbrella/resources/lib/cloud_scrapers/db_cloud.py'),
              Path('omega/plugin.video.umbrella/resources/lib/cloud_scrapers/__init__.py'),
              Path('omega/plugin.video.umbrella/resources/lib/debrid/deepbrid.py'),
              Path('omega/plugin.video.umbrella/resources/lib/modules/sources.py'),
          ]
          for path in paths:
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')

          ElementTree.parse('omega/plugin.video.umbrella/resources/settings.xml')

      - name: Integration guards
        shell: python
        run: |
          from pathlib import Path

          db_cloud = Path('omega/plugin.video.umbrella/resources/lib/cloud_scrapers/db_cloud.py').read_text()
          deepbrid = Path('omega/plugin.video.umbrella/resources/lib/debrid/deepbrid.py').read_text()
          loader = Path('omega/plugin.video.umbrella/resources/lib/cloud_scrapers/__init__.py').read_text()
          sources = Path('omega/plugin.video.umbrella/resources/lib/modules/sources.py').read_text()
          settings = Path('omega/plugin.video.umbrella/resources/settings.xml').read_text()

          assert "'provider': 'db_cloud'" in db_cloud
          assert "'debrid': 'Deepbrid'" in db_cloud
          assert 'dbt,%s,%s,%s' in db_cloud
          assert 'dbu,%s,%s,%s' in db_cloud
          assert 'cached_torrent_file_metadata' in deepbrid
          assert 'cached_usenet_file_metadata' in deepbrid
          assert 'resolve_cloud_torrent_file' in deepbrid
          assert 'resolve_cloud_usenet_file' in deepbrid
          assert "'db_cloud': ('deepbrid', 'deepbrid.token')" in loader
          assert "('deepbrid', 'db_cloud', 'deepbrid')" in sources
          assert "split('.')[-1]" in sources
          assert 'id="db_cloud.enabled"' in settings
          # One-time URLs must never be persisted in metadata entries.
          metadata_section = deepbrid[deepbrid.index('def torrent_file_metadata'):deepbrid.index('def _find_episode_file')]
          assert "'link':" not in metadata_section

      - name: Remove temporary patch files
        run: |
          rm .github/deepbrid_db_cloud_patch.py
          rm .github/workflows/deepbrid-db-cloud.yml

      - name: Commit integration
        run: |
          git config user.name "Suyash Saluja"
          git config user.email "suyash691@live.in"
          git add -A
          git commit -m "Add Deepbrid automatic cloud scraper"
          git push origin HEAD:agent/deepbrid-db-cloud
