name: Deepbrid 429 retry refinement

on:
  push:
    branches:
      - agent/deepbrid-host-errors-reuse
    paths:
      - .github/workflows/deepbrid-429-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deepbrid-host-errors-reuse
      - name: Refine 429 retries
        shell: python
        run: |
          from pathlib import Path
          p = Path('omega/plugin.video.umbrella/resources/lib/debrid/deepbrid.py')
          s = p.read_text(encoding='utf-8')
          old = """        max_attempts = 3 if method == 'GET' or safe_post else 1\n\n        for attempt in range(max_attempts):\n"""
          new = """        retry_transient = method == 'GET' or safe_post\n        max_attempts = 3\n\n        for attempt in range(max_attempts):\n"""
          if s.count(old) != 1:
              raise SystemExit('attempt block mismatch')
          s = s.replace(old, new, 1)
          s = s.replace(
              "if status in (500, 502, 503, 504) and attempt + 1 < max_attempts:",
              "if (\n                    retry_transient\n                    and status in (500, 502, 503, 504)\n                    and attempt + 1 < max_attempts\n                ):",
              1
          )
          s = s.replace(
              "if attempt + 1 < max_attempts:\n                    delay = min(1.0 * (2 ** attempt), 4.0)\n                    if not silent:\n                        log_utils.log(\n                            'Deepbrid request failed; retrying in %.1fs: %s' % (",
              "if retry_transient and attempt + 1 < max_attempts:\n                    delay = min(1.0 * (2 ** attempt), 4.0)\n                    if not silent:\n                        log_utils.log(\n                            'Deepbrid request failed; retrying in %.1fs: %s' % (",
              1
          )
          p.write_text(s, encoding='utf-8')
      - name: Syntax check
        run: python -m py_compile omega/plugin.video.umbrella/resources/lib/debrid/deepbrid.py
      - name: Remove workflow
        run: rm .github/workflows/deepbrid-429-fix.yml
      - name: Commit
        run: |
          git config user.name "Suyash Saluja"
          git config user.email "suyash691@live.in"
          git add omega/plugin.video.umbrella/resources/lib/debrid/deepbrid.py .github/workflows/deepbrid-429-fix.yml
          git commit -m "Refine Deepbrid rate-limit retries"
          git push origin HEAD:agent/deepbrid-host-errors-reuse
