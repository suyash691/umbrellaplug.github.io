name: Wire Deepbrid cloud resolver dispatch

on:
  push:
    branches:
      - agent/deepbrid-db-cloud
    paths:
      - .github/workflows/deepbrid-db-cloud-resolver.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deepbrid-db-cloud

      - name: Add db_cloud to direct cloud resolvers
        shell: python
        run: |
          from pathlib import Path
          path = Path('omega/plugin.video.umbrella/resources/lib/modules/sources.py')
          text = path.read_text(encoding='utf-8')
          old = "direct_sources = ('ad_cloud', 'oc_cloud', 'pm_cloud', 'rd_cloud', 'tb_cloud')"
          new = "direct_sources = ('ad_cloud', 'oc_cloud', 'pm_cloud', 'rd_cloud', 'tb_cloud', 'db_cloud')"
          if text.count(old) != 1:
              raise SystemExit('direct cloud resolver tuple did not match exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          compile(path.read_text(encoding='utf-8'), str(path), 'exec')

      - name: Remove one-off workflow
        run: rm .github/workflows/deepbrid-db-cloud-resolver.yml

      - name: Commit resolver wiring
        run: |
          git config user.name "Suyash Saluja"
          git config user.email "suyash691@live.in"
          git add -A
          git commit -m "Wire Deepbrid cloud source resolution"
          git push origin HEAD:agent/deepbrid-db-cloud
