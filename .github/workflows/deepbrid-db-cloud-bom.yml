name: Preserve settings XML encoding

on:
  push:
    branches:
      - agent/deepbrid-db-cloud
    paths:
      - .github/workflows/deepbrid-db-cloud-bom.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deepbrid-db-cloud

      - name: Restore UTF-8 BOM
        shell: python
        run: |
          from pathlib import Path
          path = Path('omega/plugin.video.umbrella/resources/settings.xml')
          data = path.read_bytes()
          bom = b'\xef\xbb\xbf'
          if not data.startswith(bom):
              path.write_bytes(bom + data)

      - name: Remove one-off workflow
        run: rm .github/workflows/deepbrid-db-cloud-bom.yml

      - name: Commit encoding cleanup
        run: |
          git config user.name "Suyash Saluja"
          git config user.email "suyash691@live.in"
          git add -A
          git commit -m "Preserve settings XML encoding"
          git push origin HEAD:agent/deepbrid-db-cloud
