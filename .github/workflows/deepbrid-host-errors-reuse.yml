name: Deepbrid host cache errors reuse

on:
  push:
    branches:
      - agent/deepbrid-host-errors-reuse
    paths:
      - .github/workflows/deepbrid-host-errors-reuse.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deepbrid-host-errors-reuse

      - name: Apply exact Deepbrid robustness fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('omega/plugin.video.umbrella/resources/lib/debrid/deepbrid.py')
          text = path.read_text(encoding='utf-8')

          old_import = '''from resources.lib.modules import (\n    control,\n    log_utils\n)\n'''
          new_import = '''from resources.lib.modules import (\n    control,\n    log_utils\n)\nfrom resources.lib.database import cache\n'''
          if text.count(old_import) != 1:
              raise SystemExit('import block mismatch')
          text = text.replace(old_import, new_import, 1)

          old_request = '''    def _request(self, method, endpoint, params=None, data=None,\n                 json_data=None, files=None, silent=False, timeout=None):\n\n        url = BASE_URL + endpoint.lstrip('/')\n        request_timeout = self.timeout if timeout is None else timeout\n\n        try:\n            if method.upper() == 'GET':\n                response = self.session.get(\n                    url,\n                    params=params,\n                    timeout=request_timeout\n                )\n            else:\n                response = self.session.post(\n                    url,\n                    params=params,\n                    data=data,\n                    json=json_data,\n                    files=files,\n                    timeout=request_timeout\n                )\n\n            if response.status_code == 401:\n                if not silent:\n                    control.notification(\n                        title=self.name,\n                        message='Invalid or expired API key',\n                        icon='ERROR'\n                    )\n                return {}\n\n            response.raise_for_status()\n\n            result = response.json()\n\n            if isinstance(result, dict):\n                error = result.get('error')\n\n                if error not in (None, 0, '0', False):\n                    if not silent:\n                        log_utils.log(\n                            'Deepbrid API error: %s' % result,\n                            level=log_utils.LOGWARNING\n                        )\n                    return {}\n\n            return result\n\n        except Exception as e:\n            if not silent:\n                log_utils.log(\n                    'Deepbrid request error: %s' % str(e),\n                    level=log_utils.LOGERROR\n                )\n            return {}\n'''

          new_request = '''    def _request(self, method, endpoint, params=None, data=None,\n                 json_data=None, files=None, silent=False, timeout=None):\n\n        url = BASE_URL + endpoint.lstrip('/')\n        request_timeout = self.timeout if timeout is None else timeout\n        method = method.upper()\n\n        # GET requests are safe to retry. Avoid blindly retrying torrent/\n        # Usenet creation POSTs because a timeout or 5xx may happen after\n        # Deepbrid has already accepted the transfer.\n        safe_post = endpoint.lstrip('/') in (\n            'generate/link',\n            'generate/folder'\n        )\n        max_attempts = 3 if method == 'GET' or safe_post else 1\n\n        for attempt in range(max_attempts):\n            response = None\n\n            try:\n                if method == 'GET':\n                    response = self.session.get(\n                        url,\n                        params=params,\n                        timeout=request_timeout\n                    )\n                else:\n                    response = self.session.post(\n                        url,\n                        params=params,\n                        data=data,\n                        json=json_data,\n                        files=files,\n                        timeout=request_timeout\n                    )\n\n                status = response.status_code\n\n                if status == 401:\n                    if not silent:\n                        control.notification(\n                            title=self.name,\n                            message='Invalid or expired API key',\n                            icon='ERROR'\n                        )\n                    return {\n                        'error': 401,\n                        'message': 'Invalid or expired API key'\n                    }\n\n                if status == 429 and attempt + 1 < max_attempts:\n                    try:\n                        retry_after = float(\n                            response.headers.get('Retry-After') or 1\n                        )\n                    except Exception:\n                        retry_after = 1.0\n\n                    retry_after = max(0.5, min(retry_after, 10.0))\n                    if not silent:\n                        log_utils.log(\n                            'Deepbrid rate limited; retrying in %.1fs' %\n                            retry_after,\n                            level=log_utils.LOGWARNING\n                        )\n                    time.sleep(retry_after)\n                    continue\n\n                if status in (500, 502, 503, 504) and attempt + 1 < max_attempts:\n                    delay = min(1.0 * (2 ** attempt), 4.0)\n                    if not silent:\n                        log_utils.log(\n                            'Deepbrid HTTP %s; retrying in %.1fs' % (\n                                status,\n                                delay\n                            ),\n                            level=log_utils.LOGWARNING\n                        )\n                    time.sleep(delay)\n                    continue\n\n                try:\n                    result = response.json()\n                except Exception:\n                    result = {}\n\n                if status >= 400:\n                    if not isinstance(result, dict):\n                        result = {}\n\n                    result = dict(result)\n                    result.setdefault('error', status)\n                    result.setdefault(\n                        'message',\n                        response.reason or 'HTTP %s' % status\n                    )\n\n                    if not silent:\n                        log_utils.log(\n                            'Deepbrid API error: %s' % result,\n                            level=log_utils.LOGWARNING\n                        )\n                    return result\n\n                if isinstance(result, dict):\n                    error = result.get('error')\n\n                    if error not in (None, 0, '0', False):\n                        if not silent:\n                            log_utils.log(\n                                'Deepbrid API error: %s' % result,\n                                level=log_utils.LOGWARNING\n                            )\n                        return result\n\n                return result\n\n            except (requests.exceptions.Timeout,\n                    requests.exceptions.ConnectionError) as e:\n                if attempt + 1 < max_attempts:\n                    delay = min(1.0 * (2 ** attempt), 4.0)\n                    if not silent:\n                        log_utils.log(\n                            'Deepbrid request failed; retrying in %.1fs: %s' % (\n                                delay,\n                                str(e)\n                            ),\n                            level=log_utils.LOGWARNING\n                        )\n                    time.sleep(delay)\n                    continue\n\n                if not silent:\n                    log_utils.log(\n                        'Deepbrid request error: %s' % str(e),\n                        level=log_utils.LOGERROR\n                    )\n                return {\n                    'error': 'request_failed',\n                    'message': str(e)\n                }\n\n            except Exception as e:\n                if not silent:\n                    log_utils.log(\n                        'Deepbrid request error: %s' % str(e),\n                        level=log_utils.LOGERROR\n                    )\n                return {\n                    'error': 'request_failed',\n                    'message': str(e)\n                }\n\n        return {\n            'error': 'request_failed',\n            'message': 'Deepbrid request failed'\n        }\n'''

          if text.count(old_request) != 1:
              raise SystemExit('request block mismatch')
          text = text.replace(old_request, new_request, 1)

          old_hosts = '''    def get_hosts(self):\n        hosts_dict = {\n            'Deepbrid': []\n        }\n\n        try:\n            # /hosts is public and returns:\n            # [\n            #   {"rapidgator.net": "up"},\n            #   {"turbobit.net": "up"}\n            # ]\n\n            result = self._get(\n                'hosts',\n                silent=True\n            )\n\n            hosts = []\n\n            if isinstance(result, list):\n                for item in result:\n                    if isinstance(item, dict):\n                        for domain, status in item.items():\n                            if domain:\n                                # Do not advertise hosts that are\n                                # explicitly down.\n                                if status and str(status).lower().startswith('down'):\n                                    continue\n\n                                hosts.append(\n                                    str(domain).lower()\n                                )\n\n            elif isinstance(result, dict):\n                # Be tolerant of a wrapped API response.\n                data = (\n                    result.get('hosts') or\n                    result.get('data') or\n                    []\n                )\n\n                if isinstance(data, list):\n                    for item in data:\n                        if isinstance(item, dict):\n                            for domain in item:\n                                hosts.append(\n                                    str(domain).lower()\n                                )\n\n            hosts_dict['Deepbrid'] = list(\n                set(hosts)\n            )\n\n        except:\n            log_utils.error()\n\n        return hosts_dict\n'''

          new_hosts = '''    def _fetch_hosts(self):\n        result = self._get(\n            'hosts',\n            silent=True\n        )\n\n        hosts = []\n\n        if isinstance(result, list):\n            for item in result:\n                if isinstance(item, dict):\n                    for domain, status in item.items():\n                        if not domain:\n                            continue\n\n                        if (\n                            status\n                            and str(status).lower().startswith('down')\n                        ):\n                            continue\n\n                        hosts.append(str(domain).lower())\n\n        elif isinstance(result, dict) and not result.get('error'):\n            data = (\n                result.get('hosts') or\n                result.get('data') or\n                []\n            )\n\n            if isinstance(data, list):\n                for item in data:\n                    if isinstance(item, dict):\n                        for domain, status in item.items():\n                            if not domain:\n                                continue\n\n                            if (\n                                status\n                                and str(status).lower().startswith('down')\n                            ):\n                                continue\n\n                            hosts.append(str(domain).lower())\n\n        return list(set(hosts))\n\n    def get_hosts(self):\n        hosts_dict = {\n            'Deepbrid': []\n        }\n\n        try:\n            # Deepbrid exposes live host status, so use a shorter cache than\n            # Umbrella's 168-hour RD/PM host cache while still avoiding one\n            # /hosts request per candidate host during every scrape.\n            hosts = cache.get(\n                self._fetch_hosts,\n                6\n            ) or []\n\n            hosts_dict['Deepbrid'] = hosts\n\n        except:\n            log_utils.error()\n\n        return hosts_dict\n'''

          if text.count(old_hosts) != 1:
              raise SystemExit('hosts block mismatch')
          text = text.replace(old_hosts, new_hosts, 1)

          old_before = '''        # Snapshot current IDs so we can identify a newly-created torrent\n        # if Deepbrid returns error=0 but id=None.\n        before = self._torrent_list()\n        before_ids = {\n            str(item.get('id'))\n            for item in before\n            if item.get('id')\n        }\n\n        result = self._post(\n            'torrents/add',\n            data={'magnet': magnet}\n        )\n'''

          new_before = '''        # Snapshot current torrents both for safe pre-add reuse and so we\n        # can identify a newly-created torrent when Deepbrid returns\n        # error=0/id=None. /torrents/info does not expose the info hash, so\n        # only reuse a unique exact display-name match; never fuzzy-match.\n        before = self._torrent_list()\n        expected_name = self._magnet_display_name(magnet)\n\n        if expected_name:\n            existing_matches = [\n                item for item in before\n                if str(item.get('filename', '')).strip() == expected_name\n            ]\n\n            if len(existing_matches) == 1:\n                existing_id = str(existing_matches[0]['id'])\n                log_utils.log(\n                    'Deepbrid reusing existing torrent before add: '\n                    'id=%s filename=%s' % (\n                        existing_id,\n                        expected_name\n                    ),\n                    level=log_utils.LOGDEBUG\n                )\n                return existing_id\n\n        before_ids = {\n            str(item.get('id'))\n            for item in before\n            if item.get('id')\n        }\n\n        result = self._post(\n            'torrents/add',\n            data={'magnet': magnet}\n        )\n'''

          if text.count(old_before) != 1:
              raise SystemExit('pre-add block mismatch')
          text = text.replace(old_before, new_before, 1)

          old_expected = '''        # Deepbrid sometimes returns error=0/id=None for a torrent\n        # that already exists (or was added without its ID being returned).\n        expected_name = self._magnet_display_name(magnet)\n\n        for attempt in range(3):\n'''
          new_expected = '''        # Deepbrid sometimes returns error=0/id=None for a torrent\n        # that already exists (or was added without its ID being returned).\n        for attempt in range(3):\n'''
          if text.count(old_expected) != 1:
              raise SystemExit('duplicate expected_name block mismatch')
          text = text.replace(old_expected, new_expected, 1)

          path.write_text(text, encoding='utf-8')

      - name: Syntax check
        run: python -m py_compile omega/plugin.video.umbrella/resources/lib/debrid/deepbrid.py

      - name: Remove one-off workflow
        run: rm .github/workflows/deepbrid-host-errors-reuse.yml

      - name: Commit patch
        run: |
          git config user.name "Suyash Saluja"
          git config user.email "suyash691@live.in"
          git add omega/plugin.video.umbrella/resources/lib/debrid/deepbrid.py .github/workflows/deepbrid-host-errors-reuse.yml
          git commit -m "Harden Deepbrid requests and reuse"
          git push origin HEAD:agent/deepbrid-host-errors-reuse
