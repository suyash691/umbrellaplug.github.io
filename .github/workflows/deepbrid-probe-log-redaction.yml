name: Tighten Deepbrid probe worker logging

on:
  push:
    branches:
      - agent/deepbrid-expiry-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deepbrid-expiry-hardening
          fetch-depth: 0

      - name: Redact probe worker exception text
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('omega/plugin.video.umbrella/resources/lib/debrid/deepbrid.py')
          text = path.read_text(encoding='utf-8')
          old = """                        'Deepbrid cloud probe failed: index=%s error=%s' % (\n                            futures[future],\n                            str(e)\n                        ),"""
          new = """                        'Deepbrid cloud probe failed: index=%s error=%s' % (\n                            futures[future],\n                            type(e).__name__\n                        ),"""
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY

      - name: Remove one-off workflow
        run: rm .github/workflows/deepbrid-probe-log-redaction.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add omega/plugin.video.umbrella/resources/lib/debrid/deepbrid.py .github/workflows/deepbrid-probe-log-redaction.yml
          git commit -m "Redact Deepbrid probe worker errors"
          git push origin HEAD:agent/deepbrid-expiry-hardening
