name: Deepbrid Usenet cloud integration

on:
  push:
    branches:
      - agent/deepbrid-usenet-cloud
    paths:
      - .github/deepbrid_usenet_cloud_patch.py
      - .github/workflows/deepbrid-usenet-cloud.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deepbrid-usenet-cloud

      - name: Apply Deepbrid Usenet and cloud patch
        run: python .github/deepbrid_usenet_cloud_patch.py

      - name: Syntax check
        run: |
          python -m py_compile \
            omega/plugin.video.umbrella/resources/lib/debrid/deepbrid.py \
            omega/plugin.video.umbrella/resources/lib/menus/navigator.py \
            omega/plugin.video.umbrella/resources/lib/modules/router.py

      - name: Read-only cloud guard
        run: |
          python - <<'PY'
          from pathlib import Path
          nav = Path('omega/plugin.video.umbrella/resources/lib/menus/navigator.py').read_text()
          deep = Path('omega/plugin.video.umbrella/resources/lib/debrid/deepbrid.py').read_text()
          assert 'Deepbrid: Cloud Storage (Read-only)' in nav
          assert "action=db_BrowseCloud" in deep
          cloud = deep.split('    # Cloud (read-only)', 1)[1].split('    # Delete operations', 1)[0]
          assert 'delete_' not in cloud
          PY

      - name: Remove temporary patch files
        run: |
          rm -f .github/deepbrid_usenet_cloud_patch.py
          rm -f .github/workflows/deepbrid-usenet-cloud.yml

      - name: Commit patch
        run: |
          git config user.name "Suyash Saluja"
          git config user.email "suyash691@live.in"
          git add -A
          git commit -m "Complete Deepbrid Usenet and read-only cloud browsing"
          git push origin HEAD:agent/deepbrid-usenet-cloud
