name: Deepbrid expiry and hardening

on:
  push:
    branches:
      - agent/deepbrid-expiry-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deepbrid-expiry-hardening
          fetch-depth: 0

      - name: Apply patch
        run: python .github/deepbrid_expiry_hardening_patch.py

      - name: Syntax and XML checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = [
              Path('omega/plugin.video.umbrella/resources/lib/debrid/deepbrid.py'),
              Path('omega/plugin.video.umbrella/service.py'),
          ]
          for path in files:
              source = path.read_text(encoding='utf-8')
              compile(source, str(path), 'exec')

          ET.parse('omega/plugin.video.umbrella/resources/settings.xml')
          print('syntax/xml checks passed')
          PY

      - name: Hardening guards
        run: |
          python - <<'PY'
          from pathlib import Path

          deep = Path('omega/plugin.video.umbrella/resources/lib/debrid/deepbrid.py').read_text(encoding='utf-8')
          service = Path('omega/plugin.video.umbrella/service.py').read_text(encoding='utf-8')
          settings = Path('omega/plugin.video.umbrella/resources/settings.xml').read_text(encoding='utf-8-sig')

          assert 'supported_video_extensions' in deep
          assert 'VIDEO_EXTENSIONS = tuple(supported_video_extensions())' in deep
          assert 'def _find_movie_file(self, links, title=None):' in deep
          assert 'Deepbrid movie full-probe candidates:' in deep
          assert 'Deepbrid retrying fast filename probes:' in deep
          assert "'final_url': response.url" not in deep
          assert "'location': location" not in deep
          assert 'Deepbrid Usenet selected file: name=%s size=%s' in deep
          assert "from resources.lib.debrid import deepbrid" in service
          assert "withinRangeCheck('deepbrid', days_remaining)" in service
          assert 'deepbridexpirynotice' in settings
          assert 'deepbrid.notification.range' in settings
          print('hardening guards passed')
          PY

      - name: Remove temporary workflow files
        run: |
          rm .github/deepbrid_expiry_hardening_patch.py
          rm .github/workflows/deepbrid-expiry-hardening.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add omega/plugin.video.umbrella/resources/lib/debrid/deepbrid.py \
                  omega/plugin.video.umbrella/service.py \
                  omega/plugin.video.umbrella/resources/settings.xml \
                  .github/deepbrid_expiry_hardening_patch.py \
                  .github/workflows/deepbrid-expiry-hardening.yml
          git commit -m "Add Deepbrid expiry notifications and hardening"
          git push origin HEAD:agent/deepbrid-expiry-hardening
