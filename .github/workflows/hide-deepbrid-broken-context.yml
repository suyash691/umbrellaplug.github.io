name: Hide broken Deepbrid context actions

on:
  push:
    branches:
      - agent/deepbrid-hide-broken-context
    paths:
      - .github/workflows/hide-deepbrid-broken-context.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deepbrid-hide-broken-context

      - name: Hide unsupported Deepbrid context actions
        shell: python
        run: |
          from pathlib import Path

          path = Path('omega/plugin.video.umbrella/resources/lib/windows/source_results.py')
          text = path.read_text(encoding='utf-8')

          old = "\t\t\t\tsource_dict = chosen_source.getProperty('umbrella.source_dict')\n\t\t\t\tcm_list = [('[B]Additional Link Info[/B]', 'sourceInfo')]\n\t\t\t\tif 'cached (pack)' in source_dict:\n\t\t\t\t\tcm_list += [('[B]Browse Debrid Pack[/B]', 'showDebridPack')]\n\t\t\t\tif 'unchecked (pack)' in source_dict:\n\t\t\t\t\tcm_list += [('[B]Browse Debrid Pack[/B]', 'showDebridPack')]\n"
          new = "\t\t\t\tsource_dict = chosen_source.getProperty('umbrella.source_dict')\n\t\t\t\tdebrid = chosen_source.getProperty('umbrella.debrid')\n\t\t\t\tcm_list = [('[B]Additional Link Info[/B]', 'sourceInfo')]\n\t\t\t\tif debrid != 'Deepbrid' and 'cached (pack)' in source_dict:\n\t\t\t\t\tcm_list += [('[B]Browse Debrid Pack[/B]', 'showDebridPack')]\n\t\t\t\tif debrid != 'Deepbrid' and 'unchecked (pack)' in source_dict:\n\t\t\t\t\tcm_list += [('[B]Browse Debrid Pack[/B]', 'showDebridPack')]\n"
          if text.count(old) != 1:
              raise SystemExit('pack context block did not match exactly once')
          text = text.replace(old, new, 1)

          old = "\t\t\t\tdebrid = chosen_source.getProperty('umbrella.debrid')\n\t\t\t\tif (re_match(r'^CACHED.*TORRENT', source) or 'unchecked' in source_dict) and debrid != 'EasyDebrid':\n"
          new = "\t\t\t\tif (re_match(r'^CACHED.*TORRENT', source) or 'unchecked' in source_dict) and debrid not in ('EasyDebrid', 'Deepbrid'):\n"
          if text.count(old) != 1:
              raise SystemExit('save-to-cloud condition did not match exactly once')
          text = text.replace(old, new, 1)

          old = "\t\t\t\telif cm_action == 'showDebridPack':\n"
          new = "\t\t\t\telif cm_action == 'showDebridPack' and debrid != 'Deepbrid':\n"
          if text.count(old) != 1:
              raise SystemExit('showDebridPack handler did not match exactly once')
          text = text.replace(old, new, 1)

          old = "\t\t\t\telif cm_action == 'saveToCloud':\n"
          new = "\t\t\t\telif cm_action == 'saveToCloud' and debrid != 'Deepbrid':\n"
          if text.count(old) != 1:
              raise SystemExit('saveToCloud handler did not match exactly once')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Syntax check
        run: python -m py_compile omega/plugin.video.umbrella/resources/lib/windows/source_results.py

      - name: Remove one-off workflow
        run: rm .github/workflows/hide-deepbrid-broken-context.yml

      - name: Commit patch
        run: |
          git config user.name "Suyash Saluja"
          git config user.email "suyash691@live.in"
          git add omega/plugin.video.umbrella/resources/lib/windows/source_results.py .github/workflows/hide-deepbrid-broken-context.yml
          git commit -m "Hide unsupported Deepbrid context actions"
          git push origin HEAD:agent/deepbrid-hide-broken-context
