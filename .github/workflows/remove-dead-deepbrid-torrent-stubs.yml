name: Remove dead Deepbrid torrent stubs

on:
  push:
    branches:
      - agent/remove-dead-deepbrid-torrent-stubs

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove dead methods
        run: python .github/scripts/remove_dead_deepbrid_torrent_stubs.py
      - name: Validate Deepbrid module and integration assumptions
        run: |
          python -m py_compile omega/plugin.video.umbrella/resources/lib/debrid/deepbrid.py
          git diff --check
          ! grep -q '^    def display_magnet_pack(' omega/plugin.video.umbrella/resources/lib/debrid/deepbrid.py
          ! grep -q '^    def add_uncached_torrent(' omega/plugin.video.umbrella/resources/lib/debrid/deepbrid.py
          ! grep -q "caller == 'Deepbrid'" omega/plugin.video.umbrella/resources/lib/modules/router.py
          grep -q "debrid != 'Deepbrid' and 'cached (pack)'" omega/plugin.video.umbrella/resources/lib/windows/source_results.py
          grep -q "debrid != 'Deepbrid' and 'unchecked (pack)'" omega/plugin.video.umbrella/resources/lib/windows/source_results.py
      - name: Remove one-off files
        run: |
          rm .github/scripts/remove_dead_deepbrid_torrent_stubs.py
          rm .github/workflows/remove-dead-deepbrid-torrent-stubs.yml
      - name: Commit cleanup
        run: |
          git config user.name "Suyash Saluja"
          git config user.email "suyash691@live.in"
          git add omega/plugin.video.umbrella/resources/lib/debrid/deepbrid.py .github/scripts/remove_dead_deepbrid_torrent_stubs.py .github/workflows/remove-dead-deepbrid-torrent-stubs.yml
          git diff --cached --check
          git commit -m "Remove dead Deepbrid torrent compatibility methods"
          git push
